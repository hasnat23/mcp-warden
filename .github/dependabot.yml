version: 2
updates:
  # Keep the pinned actions in CI and in action.yml current.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: pip
    directory: /
    # mcp-warden is a library: keep the lower bounds in pyproject.toml wide and only
    # raise them when a new release is outside the declared range.
    versioning-strategy: increase-if-necessary
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]
